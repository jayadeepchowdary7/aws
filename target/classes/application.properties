spring.application.name=aws_spring_application
# Enable the H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Show SQL statements in the console (helpful for debugging)
spring.jpa.show-sql=true
spring.datasource.url=jdbc:h2:mem:testdb
# Actuator configuration
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readystate.enabled=true

# Prometheus settings
management.metrics.export.prometheus.enabled=true
management.metrics.export.prometheus.step=30s
management.endpoint.prometheus.enabled=true
